<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Страница не найдена — Generation Yoga для бизнеса</title>
  <meta name="robots" content="noindex">
  <!-- Пути от корня, а не относительные: GitHub Pages отдаёт эту страницу
       по любому несуществующему адресу, в том числе /что/то/глубокое,
       и относительный путь к стилям оттуда не разрешится. -->
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;1,9..144,400;1,9..144,500&family=Manrope:wght@400..800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/css/site.css">
  <style>
    /* Экран-заглушка: центрируем блок по высоте окна, отдельного компонента
       в site.css заводить не стали — он нужен ровно в одном месте. */
    .nf { min-height: 100svh; display: flex; align-items: center; }
    .nf .num { font-family: var(--font-accent); font-style: italic; font-size: clamp(4rem, 12vw, 8rem); line-height: 1; color: var(--accent); }
  </style>
</head>
<body>
  <main class="section on-ink nf">
    <div class="wrap">
      <span class="eyebrow">Ошибка 404</span>
      <div class="num mt-s">404</div>
      <h1 class="mt-s">Такой страницы <em>здесь нет</em></h1>
      <p class="lede mt-m">Возможно, адрес набран с опечаткой или страницу переименовали. Начните с главной — там три направления работы с бизнесом.</p>
      <div class="cta-row mt-l">
        <a class="btn" href="/">На главную</a>
        <a class="link-under" href="/hr/">Забота о команде</a>
      </div>
    </div>
  </main>
</body>
</html>
